services:
  postgres-alpiplan:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alpiplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpiplan_dev_change_me}
      POSTGRES_DB: alpiplan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpiplan -d alpiplan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alpiplan-network

  redis-alpiplan:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - alpiplan-network

  backup-alpiplan:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres-alpiplan
      POSTGRES_DB: alpiplan
      POSTGRES_USER: alpiplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpiplan_dev_change_me}
      SCHEDULE: "@daily"
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - pg_backups:/backups
    depends_on:
      postgres-alpiplan:
        condition: service_healthy
    profiles:
      - backup
    networks:
      - alpiplan-network
networks:
  - alpiplan-network

volumes:
  postgres_data:
  redis_data:
  pg_backups:
