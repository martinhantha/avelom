<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avelom</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f5f5f5;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        line-height: 1.5;
      }
      code {
        font-size: 0.9em;
        background: #1a1a1a;
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Avelom</h1>
      <p>
        Native Hülle ohne Server-URL. Setze <code>CAPACITOR_SERVER_URL</code> auf deine Nuxt-App
        (z. B. <code>http://192.168.1.10:3000</code> lokal oder die Produktionsdomain) und führe
        <code>pnpm cap:sync</code> erneut aus.
      </p>
    </main>
  </body>
</html>
