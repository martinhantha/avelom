services:

  web-alpiplan:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://alpiplan:${POSTGRES_PASSWORD:-alpiplan_dev_change_me}@postgres:5432/alpiplan?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-16-chars}
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres-alpiplan:
        condition: service_healthy
      redis-alpiplan:
        condition: service_started
    networks:
      - alpiplan-network

  worker-alpiplan:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://alpiplan:${POSTGRES_PASSWORD:-alpiplan_dev_change_me}@postgres:5432/alpiplan?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres-alpiplan:
        condition: service_healthy
      redis-alpiplan:
        condition: service_started
    profiles:
      - worker
    networks:
      - alpiplan-network

networks:
  alpiplan-network:
    external: true
